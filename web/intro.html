<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relay Research — Demo introduction</title><link rel="stylesheet" href="/intro.css"><body><main><section class="slide" data-notes="Researchers can find published numbers quickly. The harder question is whether those numbers support the comparison they want to make. Relay helps them check that before building their next experiment."  aria-label="Slide 1"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#09090f"/><stop offset="1" stop-color="#25112f"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#897496"/></marker></defs><rect width="1280" height="720" fill="url(#bg)"/><text x="78" y="105" fill="#ed59d8" font-size="23" font-weight="700" font-family="Arial, sans-serif">RELAY RESEARCH</text><text x="78" y="223" fill="#fff" font-size="64" font-weight="700" font-family="Arial, sans-serif">Check the comparison</text><text x="78" y="300" fill="#ce9eff" font-size="64" font-weight="700" font-family="Arial, sans-serif">before you build on it</text><text x="80" y="379" fill="#d5c9e2" font-size="27" font-weight="400" font-family="Arial, sans-serif">For researchers choosing evidence for their next experiment.</text><rect x="80" y="466" width="290" height="120" rx="18" fill="#191322" stroke="#be8bfa" stroke-width="2"/><text x="104" y="514" fill="#be8bfa" font-size="26" font-weight="700" font-family="Arial, sans-serif">Published results</text><text x="104" y="550" fill="#d5c9e2" font-size="19" font-weight="400" font-family="Arial, sans-serif">Find the numbers</text><path d="M380 526 H470 V526" fill="none" stroke="#897496" stroke-width="3" marker-end="url(#arrow)"/><rect x="480" y="466" width="300" height="120" rx="18" fill="#191322" stroke="#be8bfa" stroke-width="2"/><text x="504" y="514" fill="#be8bfa" font-size="26" font-weight="700" font-family="Arial, sans-serif">Experimental context</text><text x="504" y="550" fill="#d5c9e2" font-size="19" font-weight="400" font-family="Arial, sans-serif">Check the conditions</text><path d="M790 526 H880 V526" fill="none" stroke="#897496" stroke-width="3" marker-end="url(#arrow)"/><rect x="890" y="466" width="310" height="120" rx="18" fill="#191322" stroke="#67c5ff" stroke-width="2"/><text x="914" y="514" fill="#67c5ff" font-size="26" font-weight="700" font-family="Arial, sans-serif">Supported result</text><text x="914" y="550" fill="#d5c9e2" font-size="19" font-weight="400" font-family="Arial, sans-serif">Keep the source attached</text></svg></section><section class="slide" data-notes="Choose the rows and conditions that matter. Relay preserves the source, checks applicability, and separates comparable, incompatible and unresolved pairs. A researcher reviews the evidence rather than accepting an unsupported ranking." hidden aria-label="Slide 2"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#09090f"/><stop offset="1" stop-color="#25112f"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#897496"/></marker></defs><rect width="1280" height="720" fill="url(#bg)"/><text x="78" y="105" fill="#fff" font-size="48" font-weight="700" font-family="Arial, sans-serif">A matching metric is only the beginning</text><text x="80" y="162" fill="#d5c9e2" font-size="25" font-weight="400" font-family="Arial, sans-serif">The dataset, model variant, training setup and evaluation can change the meaning.</text><rect x="80" y="245" width="330" height="125" rx="18" fill="#191322" stroke="#be8bfa" stroke-width="2"/><text x="104" y="293" fill="#be8bfa" font-size="26" font-weight="700" font-family="Arial, sans-serif">Choose source rows</text><text x="104" y="329" fill="#d5c9e2" font-size="19" font-weight="400" font-family="Arial, sans-serif">Keep headings and context</text><path d="M420 308 H470 V308" fill="none" stroke="#897496" stroke-width="3" marker-end="url(#arrow)"/><rect x="480" y="245" width="330" height="125" rx="18" fill="#191322" stroke="#be8bfa" stroke-width="2"/><text x="504" y="293" fill="#be8bfa" font-size="26" font-weight="700" font-family="Arial, sans-serif">Check conditions</text><text x="504" y="329" fill="#d5c9e2" font-size="19" font-weight="400" font-family="Arial, sans-serif">Show supporting quotations</text><path d="M820 308 H870 V308" fill="none" stroke="#897496" stroke-width="3" marker-end="url(#arrow)"/><rect x="880" y="245" width="320" height="125" rx="18" fill="#191322" stroke="#67c5ff" stroke-width="2"/><text x="904" y="293" fill="#67c5ff" font-size="26" font-weight="700" font-family="Arial, sans-serif">Review the judgment</text><text x="904" y="329" fill="#d5c9e2" font-size="19" font-weight="400" font-family="Arial, sans-serif">A researcher decides</text><text x="90" y="455" fill="#ce9eff" font-size="29" font-weight="700" font-family="Arial, sans-serif">Comparable within scope</text><text x="90" y="499" fill="#d5c9e2" font-size="23" font-weight="400" font-family="Arial, sans-serif">The requested conditions are supported.</text><text x="90" y="562" fill="#ed8cbd" font-size="29" font-weight="700" font-family="Arial, sans-serif">Incompatible or unresolved</text><text x="90" y="606" fill="#d5c9e2" font-size="23" font-weight="400" font-family="Arial, sans-serif">Keep valid observations even when a comparison cannot be accepted.</text></svg></section><section class="slide" data-notes="Independent papers can be read by two bounded workers. They return quoted evidence to one coordinator, which checks comparisons and rechecks proposed matches against the source. A shared budget and Stop control keep the work manageable." hidden aria-label="Slide 3"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 marker-end="url(#arrow)"/><path d="M700 445 H760 V345" fill="none" stroke="#897496" stroke-width="3" marker-end="url(#arrow)"/><rect x="770" y="290" width="420" height="115" rx="18" fill="#191322" stroke="#67c5ff" stroke-width="2"/><text x="794" y="338" fill="#67c5ff" font-size="26" font-weight="700" font-family="Arial, sans-serif">Coordinator + source recheck</text><text x="794" y="374" fill="#d5c9e2" font-size="19" font-weight="400" font-family="Arial, sans-serif">Provisional pairs → human review</text><text x="80" y="590" fill="#d5c9e2" font-size="25" font-weight="400" font-family="Arial, sans-serif">At most two workers • Shared call budget • Stop • Saved checkpoints</text><text x="80" y="637" fill="#bdb0cb" font-size="20" font-weight="400" font-family="Arial, sans-serif">Tavily discovers sources. IndexedDB keeps browser copies. No vector database required.</text></svg></section><section class="slide" data-notes="This recorded investigation retained eight accuracy observations and assessed sixteen pairs. Three passed the source recheck, twelve had conflicting conditions, and one remains unresolved. Let me show the actual evidence and execution record." hidden aria-label="Slide 4"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#09090f"/><stop offset="1" stop-color="#25112f"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#897496"/></marker></defs><rect width="1280" height="720" fill="url(#bg)"/><text x="78" y="103" fill="#fff" font-size="44" font-weight="700" font-family="Arial, sans-serif">An inspectable result, with uncertainty preserved</text><text x="80" y="160" fill="#ce9eff" font-size="26" font-weight="400" font-family="Arial, sans-serif">Recorded guided investigation: DeiT distillation accuracy</text><text x="90" y="320" fill="#ce9eff" font-size="100" font-weight="700" font-family="Arial, sans-serif">3</text><text x="90" y="370" fill="#f7f1ff" font-size="25" font-weight="400" font-family="Arial, sans-serif">comparable pairs</text><text x="475" y="320" fill="#ed8cbd" font-size="100" font-weight="700" font-family="Arial, sans-serif">12</text><text x="475" y="370" fill="#f7f1ff" font-size="25" font-weight="400" font-family="Arial, sans-serif">incompatible pairs</text><text x="900" y="320" fill="#67c5ff" font-size="100" font-weight="700" font-family="Arial, sans-serif">1</text><text x="900" y="370" fill="#f7f1ff" font-size="25" font-weight="400" font-family="Arial, sans-serif">unresolved pair</text><text x="80" y="472" fill="#fff" font-size="30" font-weight="700" font-family="Arial, sans-serif">8 retained accuracy observations • 16 assessed pairs</text><text x="80" y="533" fill="#ed59d8" font-size="32" font-weight="700" font-family="Arial, sans-serif">Ready for human review</text><text x="80" y="586" fill="#d5c9e2" font-size="23" font-weight="400" font-family="Arial, sans-serif">Reported within-paper comparisons; no independent replication claimed.</text><text x="80" y="637" fill="#d5c9e2" font-size="23" font-weight="400" font-family="Arial, sans-serif">Next: open the table, a source-checked pair, and its execution record.</text></svg></section></main><nav aria-label="Presentation controls"><a href="/">← Research desk</a><button id="previous">← Previous</button><span id="position">1 / 4</span><button id="next">Next →</button><button id="fullscreen">Fullscreen</button><button id="notes-toggle" aria-expanded="false">Speaker notes</button><a href="/#id=7d73713b7dafec55&amp;view=compare">Open the demonstration →</a></nav><aside id="notes" hidden></aside><script type="module" src="/intro.js"></script></body></html>
